# Response hardening. Loaded late (zz-) so it wins over the distribution files.

# Don't advertise the exact Apache, OpenSSL and OS build in every response.
# Default was: Apache/2.4.62 (Rocky Linux) OpenSSL/3.5.8
ServerTokens Prod
ServerSignature Off

# Don't offer TRACE.
TraceEnable Off

<IfModule mod_headers.c>
    # PHP adds X-Powered-By with its exact version. expose_php=Off in
    # 99-mantis.ini stops PHP emitting it; this catches anything that slips
    # through, such as a module setting it.
    Header always unset X-Powered-By

    # MantisBT already sets CSP, X-Frame-Options and X-Content-Type-Options on
    # its own pages. These cover everything else Apache serves -- static assets,
    # error documents -- where MantisBT never gets a chance to.
    Header setifempty X-Content-Type-Options "nosniff"
    Header setifempty Referrer-Policy "strict-origin-when-cross-origin"

    # HSTS is deliberately not set here. It belongs on the TLS terminator in
    # front of this container, and setting it from a plain-HTTP backend either
    # does nothing or locks out a hostname you did not mean to commit to.
</IfModule>
