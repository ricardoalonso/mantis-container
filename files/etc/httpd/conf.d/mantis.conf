# MantisBT document tree.
<Directory /var/www/html/mantis>
    # MantisBT ships thirteen .htaccess files. They are what denies web access
    # to core/, library/, vendor/, lang/, scripts/ and plugins/, and they carry
    # the rewrite rules the REST API needs. Apache's default AllowOverride None
    # silently ignored every one of them, which left the whole source tree
    # browsable. Honouring them keeps this in step with upstream: when MantisBT
    # protects a new directory, we get it for free.
    AllowOverride All

    # Never generate a directory index. Without this, /mantis/core/ returned a
    # full listing -- file names, sizes and modification times, which also
    # identified exactly which files carry local patches.
    Options -Indexes +FollowSymLinks

    Require all granted
</Directory>

# Defence in depth for the directories upstream denies outright, so a missing
# or unreadable .htaccess cannot expose them. fonts/ is deliberately absent:
# its .htaccess permits font files rather than denying everything.
<DirectoryMatch "^/var/www/html/mantis/(core|library|vendor|lang|scripts|plugins)(/|$)">
    Require all denied
</DirectoryMatch>

# Never serve dotfiles or editor and patch leftovers.
<FilesMatch "^\.|~$|\.(bak|orig|rej|swp)$">
    Require all denied
</FilesMatch>
