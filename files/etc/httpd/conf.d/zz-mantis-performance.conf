# Transfer and caching. Loaded late (zz-) so it wins over the distribution files.

<IfModule mod_deflate.c>
    # MantisBT's pages, CSS and JS are all highly compressible and were being
    # served uncompressed. Images, fonts and archives are already compressed,
    # so they are left alone.
    AddOutputFilterByType DEFLATE \
        text/html text/plain text/xml text/css \
        text/javascript application/javascript application/x-javascript \
        application/json application/xml application/rss+xml \
        image/svg+xml application/wasm

    # Some very old proxies mangle compressed responses; vary on the header so
    # caches keep the two variants apart.
    <IfModule mod_headers.c>
        Header append Vary Accept-Encoding
    </IfModule>
</IfModule>

<IfModule mod_expires.c>
    ExpiresActive On

    # MantisBT appends ?cache_key=<hash> to its own CSS and JS, so a long TTL is
    # safe: the URL changes whenever the content does. Assets without a cache
    # key still get a week rather than being revalidated on every page load.
    ExpiresByType text/css                  "access plus 1 week"
    ExpiresByType text/javascript           "access plus 1 week"
    ExpiresByType application/javascript    "access plus 1 week"
    ExpiresByType image/png                 "access plus 1 month"
    ExpiresByType image/jpeg                "access plus 1 month"
    ExpiresByType image/gif                 "access plus 1 month"
    ExpiresByType image/svg+xml             "access plus 1 month"
    ExpiresByType image/x-icon              "access plus 1 month"
    ExpiresByType font/woff2                "access plus 1 year"
    ExpiresByType font/woff                 "access plus 1 year"
    ExpiresByType application/font-woff2    "access plus 1 year"

    # Never cache the application itself: MantisBT sends its own Cache-Control
    # on PHP responses and they are per-user.
    ExpiresByType text/html                 "access plus 0 seconds"
</IfModule>

# KeepAlive matters here because a MantisBT page pulls in a dozen or more static
# assets. mpm_event is already the MPM, so idle keepalive connections are cheap.
KeepAlive On
MaxKeepAliveRequests 200
KeepAliveTimeout 5
