# HTTPS listener. Not in conf.d: it is included from conf.d/zz-runtime.conf only
# when HTTPD_ENABLE_HTTPS is true, which also defines the two certificate paths.
# This replaces the distribution's ssl.conf, which the build removes.

Listen 0.0.0.0:8443 https

SSLSessionCache         shmcb:/run/httpd/sslcache(512000)
SSLSessionCacheTimeout  300
SSLCryptoDevice builtin

<VirtualHost _default_:8443>
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined env=!dontlog

    SSLEngine on
    SSLHonorCipherOrder on
    # The system-wide crypto policy (update-crypto-policies) decides protocols
    # and ciphers, as for every other TLS service on EL9.
    SSLCipherSuite PROFILE=SYSTEM
    SSLProxyCipherSuite PROFILE=SYSTEM

    SSLCertificateFile    ${MANTIS_TLS_CERT}
    SSLCertificateKeyFile ${MANTIS_TLS_KEY}

    <FilesMatch "\.php$">
        SSLOptions +StdEnvVars
    </FilesMatch>
</VirtualHost>
