; MantisBT tuning. Named 99- so it is read after the distribution's php.d files.

; Don't advertise the PHP version in X-Powered-By.
expose_php = Off

; --- opcache -----------------------------------------------------------------
; opcache is enabled by the distribution but left entirely at its defaults.
; MantisBT is ~1100 PHP files before plugins, and every request includes a large
; part of core/, so this is where the cheapest wins are.

; 128M is the default and is tight once vendor/ and plugins are cached too.
opcache.memory_consumption = 192

; Shared table for repeated strings (class, function and file names). The
; default of 8M fills up on a codebase this size, after which interning stops.
opcache.interned_strings_buffer = 16

; Comfortably above the ~1100 files in the tree, leaving room for plugins.
opcache.max_accelerated_files = 20011

; How often to stat a cached file to see whether it changed on disk.
; opcache.validate_timestamps itself is set at runtime from
; PHP_OPCACHE_VALIDATE_TIMESTAMPS, in zz-runtime.ini.
opcache.revalidate_freq = 2

; MantisBT does not rely on reading docblocks at runtime, but plugins might,
; and stripping them saves little. Left on deliberately.
opcache.save_comments = 1

; JIT is off. It helps numeric workloads, not request-scoped web code like
; this, and it complicates crash diagnosis for no measurable gain here.
opcache.jit = disable
